name: Publish package

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIGURATION: Release
  OUTPUT_DIR: artifacts

jobs:
  publish:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Trusted Publishing exchanges a GitHub OIDC token for a short-lived nuget.org
    # API key, so no long-lived secret is stored. Requires a matching policy on
    # nuget.org: owner gromozeka1, repository playwright-dotnet-mstest-reqnroll,
    # workflow file publish.yml.
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore TestAutomation.slnx
    - name: Build
      run: dotnet build TestAutomation.slnx --no-restore -c "$CONFIGURATION"
    - name: Unit tests
      run: dotnet test HardPoint.Testing.Tests/HardPoint.Testing.Tests.csproj --no-build -c "$CONFIGURATION" --logger "console;verbosity=normal"
    - name: Pack
      run: dotnet pack HardPoint.Testing/HardPoint.Testing.csproj --no-build -c "$CONFIGURATION" -o "$OUTPUT_DIR"
    - name: Verify the tag matches the package version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        version=$(grep -oP '(?<=<Version>)[^<]+' HardPoint.Testing/HardPoint.Testing.csproj)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version"
          exit 1
        fi
    - name: NuGet login (OIDC to temporary API key)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish package
      run: >-
        dotnet nuget push "$OUTPUT_DIR/*.nupkg"
        --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
    - name: Publish symbols
      run: >-
        dotnet nuget push "$OUTPUT_DIR/*.snupkg"
        --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
