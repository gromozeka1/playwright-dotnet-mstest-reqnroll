name: HardPoint.Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CONFIGURATION: Release
  OUTPUT_DIR: artifacts

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          **/*.csproj
          Directory.Packages.props
          global.json
    - name: Restore dependencies
      run: dotnet restore TestAutomation.slnx
    - name: Build
      run: dotnet build TestAutomation.slnx --no-restore -c "$CONFIGURATION"
    - name: Unit tests
      run: dotnet test HardPoint.Testing.Tests/HardPoint.Testing.Tests.csproj --no-build -c "$CONFIGURATION" --logger "console;verbosity=normal"
    - name: Format check
      run: dotnet format TestAutomation.slnx --verify-no-changes
    - name: Pack
      run: dotnet pack HardPoint.Testing/HardPoint.Testing.csproj --no-build -c "$CONFIGURATION" -o "$OUTPUT_DIR"
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: |
          ${{ env.OUTPUT_DIR }}/*.nupkg
          ${{ env.OUTPUT_DIR }}/*.snupkg
        if-no-files-found: error

  # Runs in parallel with build: it packs its own copy of the package and drives a real browser
  # against it, so a package that only breaks once packed fails here.
  smoke:
    uses: ./.github/workflows/smoke.yml
